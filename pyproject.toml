[project]
name = "omnicovas"
version = "0.1.0"
description = "Intelligence suite for Elite Dangerous commanders."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary; see LICENSE.md" }
authors = [
    { name = "RocketsProjects" }
]
keywords = ["elite-dangerous", "telemetry", "intelligence", "gaming"]
classifiers = [
    # Phase 10 reconciliation (2026-07-31): "2 - Pre-Alpha" understated a
    # product with integrated, tested functionality across every planned pillar.
    # "4 - Beta" would overstate it: a Beta classifier implies a beta has been
    # distributed, and no release, release tag, or installer has been published.
    # "3 - Alpha" is the honest middle: functionality is substantially complete
    # and testable, but it has never been released to end users, accessibility
    # coverage is partial, installer flows are unrehearsed by anyone but the
    # maintainer, and binaries are unsigned. Promote to Beta when a public beta
    # is actually published.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "fastapi>=0.136.0",
    "google-genai>=1.73.1",
    "psutil>=7.2.2",
    "pywin32>=311",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.49",
    # Security floor: Starlette 1.3.1 fixes GHSA-82w8-qh3p-5jfq; it also includes
    # the hostname validation fixes tracked by GHSA-jp82-jpqv-5vv3 and
    # GHSA-86qp-5c8j-p5mr. Pinned directly to prevent resolver backsliding.
    "starlette>=1.3.1",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.44.0",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omnicovas"]
# Engineers 02B reference directory: development-only until its sources are cleared
# for redistribution (docs/engineer-directory-source-record-20261028.md).
exclude = [
    "omnicovas/data/engineer_directory_v1.json",
    "omnicovas/data/material_trader_rules_v1.json",
    "omnicovas/data/galactic_knowledge_restricted/",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "omnicovas/data/engineer_directory_v1.json",
    "omnicovas/data/material_trader_rules_v1.json",
    "omnicovas/data/galactic_knowledge_restricted/",
]

# ----------------------------------------------------------------------------
# ruff — linter and formatter
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["alembic/versions", "alembic/env.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------------------------------------------------------------
# mypy — type checker (strict mode)
# ----------------------------------------------------------------------------
[tool.mypy]
# Default target when no path is passed (`uv run mypy`); explicit
# `uv run mypy omnicovas` continues to work and checks the same package.
files = ["omnicovas"]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# ----------------------------------------------------------------------------
# pytest — testing framework
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "pre-commit>=4.5.1",
    "pyinstaller>=6.20.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-stub>=1.1.0",
    "ruff>=0.15.11",
    "sqlalchemy[mypy]>=2.0.49",
    "types-psutil>=7.2.2.20260408",
    "types-pywin32>=311.0.0.20260408",
    "types-pyyaml>=6.0.12.20260408",
]

[[tool.mypy.overrides]]
module = "watchdog.*"
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastapi.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "uvicorn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "starlette.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "structlog.*"
ignore_missing_imports = true
